# ============================================================================
# ClusterSecretStore - GCP Secret Manager 연결
# ============================================================================
# GKE Workload Identity를 사용하여 GCP Secret Manager에 접근
# ============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      # GCP 프로젝트 ID
      projectID: kdt2-final-project-t1
      auth:
        workloadIdentity:
          # GKE 클러스터 정보
          clusterLocation: asia-northeast3
          clusterName: petclinic-dr-gke
          clusterProjectID: kdt2-final-project-t1
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
