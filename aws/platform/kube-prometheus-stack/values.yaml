# ============================================================================
# kube-prometheus-stack values
# ============================================================================

kube-prometheus-stack:
  # =========================================================================
  # CRD 설정
  # =========================================================================
  # ArgoCD ServerSideApply와 함께 사용하여 큰 CRD 설치 문제 해결
  # =========================================================================
  crds:
    enabled: true
  # =========================================================================
  # Prometheus Admission Webhook 비활성화
  # =========================================================================
  # admission-create와 admission-patch Job 순서 문제로 인한 오류 방지
  # ArgoCD 배포 시 Job 간 의존성이 보장되지 않아 CrashLoopBackOff 발생할 수 있음
  # Admission webhook은 Prometheus CRD 리소스 검증용으로 필수는 아님
  # =========================================================================
  prometheusOperator:
    admissionWebhooks:
      enabled: false
    tls:
      enabled: false
  # Prometheus 설정
  prometheus:
    prometheusSpec:
      routePrefix: /prometheus
      retention: 7d
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 2Gi

  # AlertManager 설정
  alertmanager:
    alertmanagerSpec:
      routePrefix: /alertmanager
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi

  # Grafana 설정
  grafana:
    adminPassword: admin
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    defaultDashboardsEnabled: true
    sidecar:
      dashboards:
        enabled: true

  # Node Exporter
  prometheus-node-exporter:
    tolerations:
      - operator: Exists
    podAnnotations:
      karpenter.sh/do-not-disrupt: "true"

  # Kube State Metrics
  kubeStateMetrics:
    enabled: true

  # EKS에서 접근 불가능한 컴포넌트 비활성화
  defaultRules:
    rules:
      etcd: false
      kubeProxy: false
      kubeScheduler: false

  kubeEtcd:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
